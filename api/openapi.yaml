          title: Handle
          type: string
        user_id:
          format: uuid
          nullable: true
          type: string
        account_type:
          default: user
          title: Account Type
          type: string
        organization_id:
          format: uuid
          nullable: true
          type: string
        created_by_id:
          format: uuid
          nullable: true
          type: string
        name:
          nullable: true
          type: string
        bio:
          nullable: true
          type: string
        website:
          nullable: true
          type: string
        github_handle:
          nullable: true
          type: string
        twitter_handle:
          nullable: true
          type: string
        linkedin_handle:
          nullable: true
          type: string
        avatar_url:
          nullable: true
          type: string
        created_at:
          format: date-time
          nullable: true
          type: string
        updated_at:
          format: date-time
          nullable: true
          type: string
      required:
      - handle
      - id
      - lnid
      title: Account
    AddCollaboratorRequestBody:
      example:
        account_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        team_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        role: read
        add_guest_if_missing: false
      properties:
        account_id:
          description: Account UUID. Mutually exclusive with team_id.
          format: uuid
          nullable: true
          type: string
        team_id:
          description: Team UUID. Mutually exclusive with account_id.
          format: uuid
          nullable: true
          type: string
        role:
          default: read
          description: Instance role for the collaborator.
          enum:
          - admin
          - read
          - write
          title: Role
          type: string
        add_guest_if_missing:
          default: false
          description: "For account collaborators, add the account as an organization\
            \ guest first when it is not already an organization member."
          title: Add Guest If Missing
          type: boolean
      title: AddCollaboratorRequestBody
    AddOrganizationMemberRequestBody:
      example:
        role: ""
      properties:
        role:
          allOf:
          - $ref: "#/components/schemas/ORGANIZATION"
          default: member
          description: Organization role for the member.
      title: AddOrganizationMemberRequestBody
    AddSpaceCollaboratorRequestBody:
      example:
        account_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
