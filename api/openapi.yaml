openapi: 3.1.0
info:
  description: |-
    REST API for LaminHub.

    Relevant documentation:

    - [REST API](https://docs.lamin.ai/rest)
    - [Permissions](https://docs.lamin.ai/permissions)
    - [Spaces](https://docs.lamin.ai/lamindb.space)
    - [Storage](https://docs.lamin.ai/lamindb.storage)
    - [Records](https://docs.lamin.ai/records)
  title: LaminHub REST API
  version: 1.50.1
servers:
- url: https://aws.us-east-1.lamin.ai/api
paths:
  /organizations:
    put:
      description: |-
        Create an organization account and make the caller an admin.

        **Permissions:** Requires authentication.
      operationId: create_organization_organizations_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema: {}
          description: Organization created.
        "409":
          description: The handle is already in use.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: Create Organization
      tags:
      - Organizations
      x-content-type: application/json
      x-accepts:
      - application/json
  /organizations/{organization_id}:
    get:
      description: |-
        Return organization details.

        **Permissions:** Public organization profiles are visible.
      operationId: get_organization_organizations__organization_id__get
      parameters:
      - description: Organization UUID.
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          description: Organization UUID.
          format: uuid
          title: Organization Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: Get Organization
      tags:
      - Organizations
      x-accepts:
      - application/json
  /organizations/{organization_id}/members:
    get:
      description: |-
        List organization members.

        **Permissions:** Non-guest organization members can list organization members. Guests can only see their own membership.
      operationId: list_organization_members_organizations__organization_id__members_get
      parameters:
      - description: Organization UUID.
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          description: Organization UUID.
          format: uuid
          title: Organization Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: List Organization Members
      tags:
      - Organizations
      x-accepts:
      - application/json
  /organizations/{organization_id}/members/{account_id}:
    delete:
      description: |-
        Remove an organization member.

        **Permissions:** Requires organization manager or admin access. Only organization admins can remove admin members.
      operationId: remove_organization_member_organizations__organization_id__members__account_id__delete
      parameters:
      - description: Organization UUID.
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          description: Organization UUID.
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - description: Account UUID.
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          description: Account UUID.
          format: uuid
          title: Account Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: Remove Organization Member
      tags:
      - Organizations
      x-accepts:
      - application/json
    patch:
      description: |-
        Update an organization member's role.

        **Permissions:** Requires organization manager or admin access. Only organization admins can set or update admin members.

        **Quota:** Non-guest roles count against the organization's member quota.
      operationId: update_organization_member_organizations__organization_id__members__account_id__patch
      parameters:
      - description: Organization UUID.
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          description: Organization UUID.
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - description: Account UUID.
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          description: Account UUID.
          format: uuid
          title: Account Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationMemberRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "403":
          description: Member quota reached.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: Update Organization Member
      tags:
      - Organizations
      x-content-type: application/json
      x-accepts:
      - application/json
    put:
      description: |-
        Add an account to an organization.

        **Permissions:** Requires organization manager or admin access. Only organization admins can add admin members.

        **Quota:** Non-guest members count against the organization's member quota.
      operationId: add_organization_member_organizations__organization_id__members__account_id__put
      parameters:
      - description: Organization UUID.
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          description: Organization UUID.
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - description: Account UUID.
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          description: Account UUID.
          format: uuid
          title: Account Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOrganizationMemberRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema: {}
          description: Member added.
        "403":
          description: Member quota reached.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: Add Organization Member
      tags:
      - Organizations
      x-content-type: application/json
      x-accepts:
      - application/json
  /account:
    get:
      description: |-
        Return the authenticated caller account when a token is provided.

        **Permissions:** No authentication required. Unauthenticated requests return null.
      operationId: get_caller_account_account_get
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/Account"
                nullable: true
          description: "Caller account, or null if unauthenticated."
      security:
      - LaminAccessToken: []
      summary: Get Caller Account
      tags:
      - Accounts
      x-accepts:
      - application/json
  /account/jwt:
    post:
      description: |-
        Exchange a Lamin API key for an access token.

        **Permissions:** Requires a valid Lamin API key.
      operationId: exchange_api_key_for_access_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyExchangeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                title: Response Exchange Api Key For Access Token
          description: Access token exchange response.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Exchange API Key for Access Token
      tags:
      - Accounts
      x-content-type: application/json
      x-accepts:
      - application/json
  /account/jwt/exchange:
    post:
      description: |-
        Exchange an external IdP JWT for a Lamin access token.

        The external token is verified against the app's JWKS and mapped to a Lamin
        account by email. The external token itself is the credential.

        **Permissions:** Requires a valid JWT issued by the configured external app.
      operationId: exchange_external_jwt_for_access_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalJwtExchangeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                title: Response Exchange External Jwt For Access Token
          description: Access token exchange response.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Exchange External JWT for Access Token
      tags:
      - Accounts
      x-content-type: application/json
      x-accepts:
      - application/json
  /service-accounts:
    put:
      description: |-
        Create a service account in an organization.

        **Permissions:** Requires organization manager or admin access.
      operationId: create_service_account_service_accounts_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceAccountRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema: {}
          description: Service account created.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: Create Service Account
      tags:
      - Service Accounts
      x-content-type: application/json
      x-accepts:
      - application/json
  /service-accounts/organizations/{organization_id}:
    get:
      description: |-
        List service accounts in an organization.

        **Permissions:** Requires organization manager or admin access.
      operationId: list_service_accounts_by_organization_service_accounts_organizations__organization_id__get
      parameters:
      - description: Organization UUID.
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          description: Organization UUID.
          format: uuid
          title: Organization Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: List Service Accounts By Organization
      tags:
      - Service Accounts
      x-accepts:
      - application/json
  /service-accounts/{organization_id}/{handle}:
    delete:
      description: |-
        Delete a service account.

        **Permissions:** Requires organization manager or admin access.
      operationId: delete_service_account_service_accounts__organization_id___handle__delete
      parameters:
      - description: Organization UUID.
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          description: Organization UUID.
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - description: Account or service-account handle.
        explode: false
        in: path
        name: handle
        required: true
        schema:
          description: Account or service-account handle.
          title: Handle
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: Delete Service Account
      tags:
      - Service Accounts
      x-accepts:
      - application/json
    get:
      description: |-
        Return a service account by handle.

        **Permissions:** Requires organization manager or admin access.
      operationId: get_service_account_service_accounts__organization_id___handle__get
      parameters:
      - description: Organization UUID.
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          description: Organization UUID.
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - description: Account or service-account handle.
        explode: false
        in: path
        name: handle
        required: true
        schema:
          description: Account or service-account handle.
          title: Handle
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: Get Service Account
      tags:
      - Service Accounts
      x-accepts:
      - application/json
    patch:
      description: |-
        Update a service account.

        **Permissions:** Requires organization manager or admin access.
      operationId: update_service_account_service_accounts__organization_id___handle__patch
      parameters:
      - description: Organization UUID.
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          description: Organization UUID.
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - description: Account or service-account handle.
        explode: false
        in: path
        name: handle
        required: true
        schema:
          description: Account or service-account handle.
          title: Handle
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceAccountRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: Update Service Account
      tags:
      - Service Accounts
      x-content-type: application/json
      x-accepts:
      - application/json
  /service-accounts/{organization_id}/{handle}/api-keys:
    get:
      description: |-
        List API keys for a service account.

        **Permissions:** Requires organization manager or admin access.

        **Notes:** Plaintext keys are not returned.
      operationId: list_service_account_api_keys_service_accounts__organization_id___handle__api_keys_get
      parameters:
      - description: Organization UUID.
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          description: Organization UUID.
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - description: Account or service-account handle.
        explode: false
        in: path
        name: handle
        required: true
        schema:
          description: Account or service-account handle.
          title: Handle
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: List Service Account Api Keys
      tags:
      - Service Accounts
      x-accepts:
      - application/json
    post:
      description: |-
        Create an API key for a service account.

        **Permissions:** Requires organization manager or admin access.

        **Notes:** The plaintext key is returned once.
      operationId: create_service_account_api_key_service_accounts__organization_id___handle__api_keys_post
      parameters:
      - description: Organization UUID.
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          description: Organization UUID.
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - description: Account or service-account handle.
        explode: false
        in: path
        name: handle
        required: true
        schema:
          description: Account or service-account handle.
          title: Handle
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceAccountApiKeyRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema: {}
          description: API key created.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: Create Service Account Api Key
      tags:
      - Service Accounts
      x-content-type: application/json
      x-accepts:
      - application/json
  /service-accounts/{organization_id}/{handle}/api-keys/{api_key_id}:
    delete:
      description: |-
        Delete an API key for a service account.

        **Permissions:** Requires organization manager or admin access.
      operationId: delete_service_account_api_key_service_accounts__organization_id___handle__api_keys__api_key_id__delete
      parameters:
      - description: Organization UUID.
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          description: Organization UUID.
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - description: Account or service-account handle.
        explode: false
        in: path
        name: handle
        required: true
        schema:
          description: Account or service-account handle.
          title: Handle
          type: string
        style: simple
      - description: API key ID.
        explode: false
        in: path
        name: api_key_id
        required: true
        schema:
          description: API key ID.
          title: Api Key Id
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: Delete Service Account Api Key
      tags:
      - Service Accounts
      x-accepts:
      - application/json
  /secrets/{organization_id}/{name}:
    delete:
      description: |-
        Delete a secret by name.

        **Permissions:** Requires organization admin access.

        **Notes:** Deletes the stored secret and its metadata.
      operationId: delete_secret_secrets__organization_id___name__delete
      parameters:
      - description: Organization UUID.
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          description: Organization UUID.
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - description: Secret name.
        explode: false
        in: path
        name: name
        required: true
        schema:
          description: Secret name.
          title: Name
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: Delete Secret
      tags:
      - Secrets
      x-accepts:
      - application/json
    get:
      description: |-
        Return a secret value by name.

        **Permissions:** Requires organization admin access.
      operationId: get_secret_secrets__organization_id___name__get
      parameters:
      - description: Organization UUID.
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          description: Organization UUID.
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - description: Secret name.
        explode: false
        in: path
        name: name
        required: true
        schema:
          description: Secret name.
          title: Name
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: Get Secret
      tags:
      - Secrets
      x-accepts:
      - application/json
    put:
      description: |-
        Set a secret value by name.

        **Permissions:** Requires organization admin access.

        **Notes:** Creates the secret when it does not exist.
      operationId: set_secret_secrets__organization_id___name__put
      parameters:
      - description: Organization UUID.
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          description: Organization UUID.
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - description: Secret name.
        explode: false
        in: path
        name: name
        required: true
        schema:
          description: Secret name.
          title: Name
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSecretRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: Set Secret
      tags:
      - Secrets
      x-content-type: application/json
      x-accepts:
      - application/json
  /spaces:
    put:
      description: |-
        Create a space in an organization.

        **Permissions:** Requires organization manager or admin access.
      operationId: create_space_spaces_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema: {}
          description: Space created.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: Create Space
      tags:
      - Spaces
      x-content-type: application/json
      x-accepts:
      - application/json
  /spaces/{space_id}:
    delete:
      description: |-
        Delete a space.

        **Permissions:** Requires organization manager or admin access.

        **Notes:** The space must not be attached to any instances.
      operationId: delete_space_spaces__space_id__delete
      parameters:
      - description: Space UUID.
        explode: false
        in: path
        name: space_id
        required: true
        schema:
          description: Space UUID.
          format: uuid
          title: Space Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: Delete Space
      tags:
      - Spaces
      x-accepts:
      - application/json
    get:
      description: |-
        Return space details.

        **Permissions:** Requires non-guest membership in the organization or space collaborator access.
      operationId: get_space_spaces__space_id__get
      parameters:
      - description: Space UUID.
        explode: false
        in: path
        name: space_id
        required: true
        schema:
          description: Space UUID.
          format: uuid
          title: Space Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - LaminAccessToken: []
      summary: Get Space
      tags:
      - Spaces
      x-accepts:
      - application/json
    patch:
      description: |-
        Update a space's name or description.

        **Permissions:** Requires organization manager or admin access.
      operationId: update_space_spaces__space_id__patch
      parameters:
      - description: Space UUID.
        explode: false
        in: path
        name: space_id
        required: true
        schema:
          description: Space UUID.
          format: uuid
          title: Space Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSpaceRequestBody"
