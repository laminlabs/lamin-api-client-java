openapi: 3.1.0
info:
  title: FastAPI
  version: 0.1.0
servers:
- url: https://staging.laminhub.com/api
paths:
  /organizations/{organization_id}:
    get:
      description: |-
        Get details of a specific organization.

        Parameters:
        - **organization_id**: UUID of the organization to retrieve

        Returns:
        - **200**: Organization details retrieved successfully
        - **404**: Organization not found
      operationId: get_organization_organizations__organization_id__get
      parameters:
      - explode: false
        in: path
        name: organization_id
        required: true
        schema:
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Organization
      tags:
      - Organizations
      x-accepts:
      - application/json
  /organizations/{organization_id}/members:
    get:
      description: |-
        List all members of an organization.

        Parameters:
        - **organization_id**: UUID of the organization to list members for

        Returns:
        - **200**: List of organization members retrieved successfully
      operationId: list_organization_members_organizations__organization_id__members_get
      parameters:
      - explode: false
        in: path
        name: organization_id
        required: true
        schema:
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Organization Members
      tags:
      - Organizations
      x-accepts:
      - application/json
  /organizations/{organization_id}/members/{account_id}:
    delete:
      description: |-
        Remove a member from an organization.

        Parameters:
        - **organization_id**: UUID of the organization to remove the member from
        - **account_id**: UUID of the account to remove from the organization

        Returns:
        - **200**: Organization member removed successfully
        - **404**: Member not found in organization
      operationId: remove_organization_member_organizations__organization_id__members__account_id__delete
      parameters:
      - explode: false
        in: path
        name: organization_id
        required: true
        schema:
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - explode: false
        in: path
        name: account_id
        required: true
        schema:
          format: uuid
          title: Account Id
          type: string
        style: simple
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Remove Organization Member
      tags:
      - Organizations
      x-accepts:
      - application/json
    patch:
      description: |-
        Update an organization member's details.

        Parameters:
        - **organization_id**: UUID of the organization the member belongs to
        - **account_id**: UUID of the account to update
        - **body**: Request body containing updated member details
          - **role**: Role of the member in the organization

        Returns:
        - **200**: Organization member updated successfully
        - **404**: Member not found in organization
      operationId: update_organization_member_organizations__organization_id__members__account_id__patch
      parameters:
      - explode: false
        in: path
        name: organization_id
        required: true
        schema:
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - explode: false
        in: path
        name: account_id
        required: true
        schema:
          format: uuid
          title: Account Id
          type: string
        style: simple
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationMemberRequestBody'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Organization Member
      tags:
      - Organizations
      x-content-type: application/json
      x-accepts:
      - application/json
    put:
      description: |-
        Add a member to an organization.

        Parameters:
        - **organization_id**: UUID of the organization to add the member to
        - **account_id**: UUID of the account to add as a member
        - **body**: Request body containing member details
          - **role**: Role of the member in the organization

        Returns:
        - **201**: Organization member added successfully
      operationId: add_organization_member_organizations__organization_id__members__account_id__put
      parameters:
      - explode: false
        in: path
        name: organization_id
        required: true
        schema:
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - explode: false
        in: path
        name: account_id
        required: true
        schema:
          format: uuid
          title: Account Id
          type: string
        style: simple
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrganizationMemberRequestBody'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Add Organization Member
      tags:
      - Organizations
      x-content-type: application/json
      x-accepts:
      - application/json
  /account:
    get:
      operationId: get_caller_account_account_get
      parameters:
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Caller Account
      tags:
      - Accounts
      x-accepts:
      - application/json
  /spaces:
    put:
      description: |-
        Create a new space.

        Parameters:
        - **body**: Request body containing space details
          - **name**: Name of the space
          - **organization_id**: UUID of the organization
          - **description**: Optional description of the space

        Returns:
        - **201**: Space created successfully
      operationId: create_space_spaces_put
      parameters:
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpaceRequestBody'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Space
      tags:
      - Spaces
      x-content-type: application/json
      x-accepts:
      - application/json
  /spaces/{space_id}:
    delete:
      description: |-
        Delete a space and detach it from the instance.

        Parameters:
        - **space_id**: ID of the space to delete

        Returns:
        - **200**: Space deleted successfully
        - **404**: Space not found
      operationId: delete_space_spaces__space_id__delete
      parameters:
      - explode: false
        in: path
        name: space_id
        required: true
        schema:
          format: uuid
          title: Space Id
          type: string
        style: simple
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Space
      tags:
      - Spaces
      x-accepts:
      - application/json
    get:
      description: |-
        Get details of a specific space.

        Parameters:
        - **space_id**: ID of the space to retrieve

        Returns:
        - **200**: Space details retrieved successfully
        - **404**: Space not found
      operationId: get_space_spaces__space_id__get
      parameters:
      - explode: false
        in: path
        name: space_id
        required: true
        schema:
          format: uuid
          title: Space Id
          type: string
        style: simple
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Space
      tags:
      - Spaces
      x-accepts:
      - application/json
    patch:
      description: |-
        Update a space's details.

        Parameters:
        - **space_id**: ID of the space to update
        - **body**: Request body containing updated space details
          - **name**: Optional new name for the space
          - **description**: Optional new description for the space

        Returns:
        - **200**: Space updated successfully
      operationId: update_space_spaces__space_id__patch
      parameters:
      - explode: false
        in: path
        name: space_id
        required: true
        schema:
          format: uuid
          title: Space Id
          type: string
        style: simple
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpaceRequestBody'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Space
      tags:
      - Spaces
      x-content-type: application/json
      x-accepts:
      - application/json
  /spaces/{space_id}/record-attachments:
    put:
      description: |-
        Move a record to a specific space.

        Parameters:
        - **space_id**: ID of the space to move the record to
        - **body**: Request body containing record details
          - **module_name**: Module name of the record
          - **model_name**: Model name of the record
          - **record_id**: ID of the record to move in the space
        - **instance_id**: UUID of the instance (from URL path)
        - **schema_id**: UUID of the schema (from URL path)

        Returns:
        - **200**: Record moved to the space successfully

        Requires admin access to the instance
      operationId: move_record_to_space_spaces__space_id__record_attachments_put
      parameters:
      - explode: true
        in: query
        name: instance_db_space_id
        required: true
        schema:
          title: Instance Db Space Id
          type: integer
        style: form
      - explode: true
        in: query
        name: instance_id
        required: false
        schema:
          format: uuid
          nullable: true
          type: string
        style: form
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachSpaceToRecordRequestBody'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Move Record To Space
      tags:
      - Spaces
      x-content-type: application/json
      x-accepts:
      - application/json
  /spaces/{space_id}/instances/{instance_id}:
    delete:
      description: |-
        Detach a space from a specific instance.

        Parameters:
        - **space_id**: ID of the space to detach
        - **instance_id**: UUID of the instance to detach the space from (from URL path)

        Returns:
        - **200**: Space detached from instance successfully

        Requires admin access to the instance
      operationId: detach_space_from_instance_spaces__space_id__instances__instance_id__delete
      parameters:
      - explode: false
        in: path
        name: space_id
        required: true
        schema:
          format: uuid
          title: Space Id
          type: string
        style: simple
      - explode: false
        in: path
        name: instance_id
        required: true
        schema:
          format: uuid
          nullable: true
          type: string
        style: simple
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Detach Space From Instance
      tags:
      - Spaces
      x-accepts:
      - application/json
    put:
      description: |-
        Attach a space to a specific instance.

        Parameters:
        - **space_id**: ID of the space to attach
        - **instance_id**: UUID of the instance to attach the space to (from URL path)

        Returns:
        - **200**: Space attached to instance successfully

        Requires admin access to the instance
      operationId: attach_space_to_instance_spaces__space_id__instances__instance_id__put
      parameters:
      - explode: false
        in: path
        name: space_id
        required: true
        schema:
          format: uuid
          title: Space Id
          type: string
        style: simple
      - explode: false
        in: path
        name: instance_id
        required: true
        schema:
          format: uuid
          nullable: true
          type: string
        style: simple
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Attach Space To Instance
      tags:
      - Spaces
      x-accepts:
      - application/json
  /spaces/{space_id}/instances:
    get:
      description: |-
        List all instances that have this space attached.

        Parameters:
        - **space_id**: ID of the space to check

        Returns:
        - **200**: List of instances using the space retrieved successfully
      operationId: list_instances_using_space_spaces__space_id__instances_get
      parameters:
      - explode: false
        in: path
        name: space_id
        required: true
        schema:
          format: uuid
          title: Space Id
          type: string
        style: simple
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Instances Using Space
      tags:
      - Spaces
      x-accepts:
      - application/json
  /spaces/instances/{instance_id}:
    get:
      description: |-
        List all spaces attached to an instance.

        Parameters:
        - **instance_id**: UUID of the instance to list spaces for (from URL path)

        Returns:
        - **200**: List of spaces attached to the instance retrieved successfully
      operationId: list_instance_spaces_spaces_instances__instance_id__get
      parameters:
      - explode: false
        in: path
        name: instance_id
        required: true
        schema:
          format: uuid
          nullable: true
          type: string
        style: simple
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Instance Spaces
      tags:
      - Spaces
      x-accepts:
      - application/json
  /spaces/{space_id}/collaborators:
    delete:
      description: |-
        Remove a collaborator (account or team) from a space.

        Parameters:
        - **space_id**: ID of the space to remove the collaborator from
        - **account_id**: UUID of the account to remove (mutually exclusive with team_id)
        - **team_id**: UUID of the team to remove (mutually exclusive with account_id)

        Returns:
        - **200**: Collaborator removed from space successfully
        - **400**: Invalid input (e.g., both account_id and team_id provided or neither provided)
      operationId: remove_space_collaborator_spaces__space_id__collaborators_delete
      parameters:
      - explode: false
        in: path
        name: space_id
        required: true
        schema:
          format: uuid
          title: Space Id
          type: string
        style: simple
      - explode: true
        in: query
        name: account_id
        required: false
        schema:
          format: uuid
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: team_id
        required: false
        schema:
          format: uuid
          nullable: true
          type: string
        style: form
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Remove Space Collaborator
      tags:
      - Spaces
      x-accepts:
      - application/json
    get:
      description: |-
        List all collaborators of a space.

        Parameters:
        - **space_id**: ID of the space to list collaborators for

        Returns:
        - **200**: List of space collaborators retrieved successfully
      operationId: list_space_collaborators_spaces__space_id__collaborators_get
      parameters:
      - explode: false
        in: path
        name: space_id
        required: true
        schema:
          format: uuid
          title: Space Id
          type: string
        style: simple
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Space Collaborators
      tags:
      - Spaces
      x-accepts:
      - application/json
    patch:
      description: |-
        Update a collaborator's permissions in a space.

        Parameters:
        - **space_id**: ID of the space to update the collaborator in
        - **body**: Request body containing collaborator details
          - **account_id**: UUID of the account to update (mutually exclusive with team_id)
          - **team_id**: UUID of the team to update (mutually exclusive with account_id)
          - **role**: Role of the collaborator

        Returns:
        - **200**: Collaborator updated successfully
        - **400**: Invalid input (e.g., both account_id and team_id provided)
        - **404**: Collaborator not found in space
      operationId: update_space_collaborator_spaces__space_id__collaborators_patch
      parameters:
      - explode: false
        in: path
        name: space_id
        required: true
        schema:
          format: uuid
          title: Space Id
          type: string
        style: simple
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpaceCollaboratorRequestBody'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Space Collaborator
      tags:
      - Spaces
      x-content-type: application/json
      x-accepts:
      - application/json
    put:
      description: |-
        Add a collaborator (account or team) to a space.

        Parameters:
        - **space_id**: ID of the space to add the collaborator to
        - **body**: Request body containing collaborator details
          - **account_id**: UUID of the account to add (mutually exclusive with team_id)
          - **team_id**: UUID of the team to add (mutually exclusive with account_id)
          - **role**: Role of the collaborator

        Returns:
        - **201**: Collaborator added to space successfully
        - **400**: Invalid input (e.g., both account_id and team_id provided)
      operationId: add_space_collaborator_spaces__space_id__collaborators_put
      parameters:
      - explode: false
        in: path
        name: space_id
        required: true
        schema:
          format: uuid
          title: Space Id
          type: string
        style: simple
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSpaceCollaboratorRequestBody'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Add Space Collaborator
      tags:
      - Spaces
      x-content-type: application/json
      x-accepts:
      - application/json
  /spaces/organizations/{organization_id}:
    get:
      description: |-
        List all spaces in an organization.

        Parameters:
        - **organization_id**: UUID of the organization to list spaces for

        Returns:
        - **200**: List of spaces retrieved successfully
      operationId: list_organization_spaces_spaces_organizations__organization_id__get
      parameters:
      - explode: false
        in: path
        name: organization_id
        required: true
        schema:
          format: uuid
          title: Organization Id
          type: string
        style: simple
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Organization Spaces
      tags:
      - Spaces
      x-accepts:
      - application/json
  /teams:
    put:
      description: |-
        Create a new team.

        Parameters:
        - **body**: Request body containing team details
          - **name**: Name of the team
          - **organization_id**: UUID of the organization
          - **description**: Optional description of the team

        Returns:
        - **201**: Team created successfully
      operationId: create_team_teams_put
      parameters:
      - explode: false
        in: header
        name: Authorization
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequestBody'
        required: true
      responses:
        "200":
          content:
            application/json:
